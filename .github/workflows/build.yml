name: Build and test Stride
on:
  push:
    branches: [main, 'codex/**', 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev pkg-config xvfb libgl1-mesa-dri
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Render the actual game with software OpenGL
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 target/debug/stride --smoke-test --screenshot stride.ppm
      - name: Check options and alternate render resolutions
        run: |
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 target/debug/stride --smoke-test --options --test-resolution 960x540 --test-cap 30 --screenshot options.ppm
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 target/debug/stride --smoke-test --tower-view --test-resolution 1920x1080 --screenshot tower.ppm
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 target/debug/stride --smoke-test --controller-options --screenshot controller.ppm
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 target/debug/stride --smoke-test --dive-view --screenshot dive.ppm
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 target/debug/stride --smoke-test --help-view --screenshot controls.ppm
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 target/debug/stride --smoke-test --course-overview --screenshot skyway.ppm
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 target/debug/stride --smoke-test --course-view 4 --screenshot clockwork.ppm
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 target/debug/stride --smoke-test --course-menu --screenshot course-menu.ppm
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 target/debug/stride --smoke-test --materials-view --test-resolution 1920x1080 --screenshot materials.ppm
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 target/debug/stride --smoke-test --highlands-overview --screenshot highlands.ppm
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 target/debug/stride --smoke-test --region-view 0 --screenshot long-run.ppm
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 target/debug/stride --smoke-test --region-view 1 --screenshot basin.ppm
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 target/debug/stride --smoke-test --region-view 2 --screenshot ridge.ppm
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 target/debug/stride --smoke-test --region-view 3 --screenshot mountain.ppm
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 target/debug/stride --smoke-test --region-view 4 --screenshot block-fields.ppm
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 target/debug/stride --smoke-test --explore-menu --screenshot explore-menu.ppm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stride-render-smoke-test
          path: '*.ppm'
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - name: Build standalone Windows executable
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked
      - name: Package for double-click play
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Stride-Windows
          Copy-Item target/release/stride.exe dist/Stride-Windows/Stride.exe
          Copy-Item PLAY.txt,COURSE.md,MOVEMENT.md,LANDSCAPE.md,LICENSE,THIRD_PARTY.txt dist/Stride-Windows/
          Copy-Item -Recurse licenses dist/Stride-Windows/licenses
          Compress-Archive -Path dist/Stride-Windows -DestinationPath dist/Stride-Windows.zip
          Get-FileHash dist/Stride-Windows.zip -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Stride-Windows
          path: |
            dist/Stride-Windows.zip
            dist/SHA256.txt
          retention-days: 90
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v')
    needs: [validate, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Stride-Windows
          path: release-assets
      - name: Publish the tested Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$GITHUB_REF_NAME" = "release/v$version"
          # The title is the notes' heading, which must name this version.
          title=$(head -n 1 RELEASE_NOTES.md | sed 's/^# *//')
          case "$title" in
            *"$version"*) ;;
            *) echo "RELEASE_NOTES.md heading must name $version: $title"; exit 1 ;;
          esac
          gh release create "v$version" \
            release-assets/Stride-Windows.zip release-assets/SHA256.txt \
            --target "$GITHUB_SHA" --title "$title" \
            --notes-file RELEASE_NOTES.md --latest
